<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Юридический помощник</title><style>
:root{font:16px system-ui;color:#172239;background:#f3f6fa}body{margin:0}header{background:#183658;color:white;padding:1.1rem 5%}main{display:grid;grid-template-columns: minmax(0,2fr) minmax(260px,1fr);gap:1rem;max-width:1200px;margin:1rem auto;padding:0 1rem}.panel{background:white;border-radius:12px;padding:1.2rem;box-shadow:0 2px 12px #20304012}h1{font-size:1.3rem;margin:0}h2{font-size:1.05rem}#messages{min-height:240px;max-height:55vh;overflow:auto}.message{padding:.8rem;margin:.7rem 0;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4fa}.user{background:#e3eefc}textarea{width:100%;box-sizing:border-box;min-height:85px;padding:.7rem;border:1px solid #aab9ca;border-radius:8px;font:inherit}button{background:#18579b;color:white;border:0;border-radius:6px;padding:.65rem 1rem;cursor:pointer;margin:.4rem .4rem 0 0}button.secondary{background:#e7eef6;color:#183658}a{color:#18579b;cursor:pointer}#documentText{white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto}mark{background:#ffe090}small{color:#53647b} @media(max-width:760px){main{grid-template-columns:1fr}}
</style></head><body><header><h1>Юридический помощник</h1><small style="color:#d6e6f8">Ответы по загруженной базе документов</small></header><main><section class="panel"><h2>Диалог</h2><div id="messages" aria-live="polite"></div><p id="status" role="status" aria-live="polite"></p><form id="form"><label for="question">Ваш вопрос</label><textarea id="question" required maxlength="10000"></textarea><button id="send">Отправить</button><button type="button" class="secondary" id="clear">Новый диалог</button></form><p><small>Проверяйте выводы по источникам. При отсутствии данных ассистент укажет ограничения.</small></p></section><aside class="panel"><h2>Документы и фрагменты</h2><div id="documents"></div><h3 id="docTitle"></h3><div id="documentText"></div></aside></main><script>
const turns=[], messages=document.querySelector('#messages'), list=document.querySelector('#documents'), content=document.querySelector('#documentText');
const status=document.querySelector('#status'), question=document.querySelector('#question'), send=document.querySelector('#send'), clear=document.querySelector('#clear');
let busy=false, sourceRequest=0;
function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
function show(role,text,sources=[],fallback=false){
  const box=el('div',(role==='user'?'Вы: ':'Ассистент: ')+text);box.className='message '+role;
  if(fallback)box.append(el('p','Запасной ответ: проверьте источник и доступность модели.'));
  if(sources.length){
    box.append(el('p','Источники ответа:'));
    sources.forEach(s=>{const a=el('a',s.title+(s.label?' — '+s.label:''));a.href='#documentText';a.onclick=e=>{e.preventDefault();openDoc(s.document,s.node)};box.append(a,document.createElement('br'))});
  }
  messages.append(box);messages.scrollTop=messages.scrollHeight;
}
async function openDoc(id,node=''){
  const request=++sourceRequest;
  document.querySelector('#docTitle').textContent='Загрузка документа…';
  content.textContent='Загружаю источник…';
  try{
    const r=await fetch('/api/documents/'+encodeURIComponent(id)+'?node='+encodeURIComponent(node));
    if(!r.ok)throw Error('document unavailable');
    const d=await r.json();
    if(request!==sourceRequest)return;
    document.querySelector('#docTitle').textContent=d.title;
    content.replaceChildren();
    // API offsets use Unicode codepoints; JavaScript string indexes use UTF-16.
    const chars=Array.from(d.text);
    let mark=null;
    if(Number.isInteger(d.start)&&Number.isInteger(d.end)&&d.start>=0&&d.end>d.start&&d.end<=chars.length){
      mark=el('mark',chars.slice(d.start,d.end).join(''));
      content.append(document.createTextNode(chars.slice(0,d.start).join('')),mark,document.createTextNode(chars.slice(d.end).join('')));
    }else{
      if(d.fragment)content.append(el('strong','Фрагмент (положение в исходном тексте не определено):'),el('p',d.fragment));
      content.append(document.createTextNode(d.text));
    }
    content.scrollTop=0;
    if(mark)mark.scrollIntoView({block:'center'});
    else content.scrollIntoView({block:'nearest'});
  }catch(_){
    if(request!==sourceRequest)return;
    document.querySelector('#docTitle').textContent='Документ недоступен';
    content.textContent='Не удалось загрузить источник. Повторите переход по ссылке.';
  }
}
list.textContent='Загружаю список документов…';
fetch('/api/documents').then(r=>{if(!r.ok)throw Error();return r.json()}).then(ds=>{
  if(!Array.isArray(ds))throw Error();
  list.replaceChildren();
  if(!ds.length)list.textContent='В базе нет документов.';
  ds.forEach(d=>{const a=el('a',d.title);a.href='#documentText';a.onclick=e=>{e.preventDefault();openDoc(d.id)};list.append(a,document.createElement('br'))});
}).catch(()=>list.textContent='Не удалось загрузить список документов');
clear.onclick=()=>{if(busy)return;turns.length=0;messages.replaceChildren();question.value='';status.textContent=''};
document.querySelector('#form').onsubmit=async e=>{
  e.preventDefault();
  const text=question.value.trim();
  if(busy||!text)return;
  busy=true;
  if(turns.length>=30)turns.splice(0,2);
  turns.push({role:'user',text});show('user',text);question.value='';
  send.disabled=true;clear.disabled=true;question.disabled=true;
  status.textContent='Ищу положения и проверяю ответ…';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({turns})});
    if(!r.ok)throw Error();
    const data=await r.json();
    if(typeof data.answer!=='string'||!data.answer.trim()||!Array.isArray(data.sources))throw Error();
    turns.push({role:'assistant',text:data.answer});show('assistant',data.answer,data.sources,data.fallback);
    status.textContent='Готово';
  }catch(_){
    turns.pop();question.value=text;
    show('assistant','Не удалось получить ответ. Попробуйте ещё раз.');
    status.textContent='Ответ не получен. Вопрос сохранён для повторной отправки.';
  }finally{
    busy=false;send.disabled=false;clear.disabled=false;question.disabled=false;question.focus();
  }
};
</script></body></html>
